name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # 三个平台都跑：mdserve 大量依赖文件路径、符号链接与文件权限判断，
    # 只在 Linux 上测会漏掉 macOS / Windows 的差异（例如 EvalSymlinks 行为）。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 格式检查
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: 测试
        if: runner.os != 'Windows'
        run: go test ./... -race

      - name: 测试（Windows 跑不了 race）
        if: runner.os == 'Windows'
        run: go test ./...

      - name: 构建
        run: go build ./...

      - name: 配置示例可解析
        run: go run . config --config config.example.yaml

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
