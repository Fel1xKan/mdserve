name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 测试
        run: go test ./...

      # 发布说明来自 CHANGELOG：缺段落时 release 页面会是空的，
      # 所以宁可在发布前失败。
      - name: 校验 CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "## \[${version}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 缺少 ${version} 段落"
            exit 1
          fi

      # 发布说明直接取 CHANGELOG 里当前版本的段落，而不是 commit 列表。
      - name: 生成发布说明
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v hdr="## [${version}]" '
            index($0, hdr) == 1 { inside = 1; next }
            inside && substr($0, 1, 3) == "## " { exit }
            inside { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/release-notes.md"
          if [ ! -s "${RUNNER_TEMP}/release-notes.md" ]; then
            echo "::error::CHANGELOG.md 里 ${version} 的段落是空的"
            exit 1
          fi

      # CGO_ENABLED=0 交叉编译，macOS 产物在 ubuntu runner 上产出。
      - name: 发布
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          # 不能写进仓库目录：goreleaser 会以 "git is in a dirty state" 拒绝运行。
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 直接查 release 上的资产：dist/ 里的布局由 goreleaser 决定，
      # 用户拿到的却是 release 附件，校验后者才有意义。
      - name: 校验产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name')
          echo "$assets"
          for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 \
                          windows-amd64.exe windows-arm64.exe; do
            name="mdserve-${version}-${platform}"
            if ! grep -qx "$name" <<< "$assets"; then
              echo "::error::缺少 $name"
              exit 1
            fi
          done
          if ! grep -qx checksums.txt <<< "$assets"; then
            echo "::error::缺少 checksums.txt"
            exit 1
          fi
