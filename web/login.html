{{define "login"}}<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>登录 · {{.Product}}</title>
<link rel="stylesheet" href="{{.Base}}/-/vendor/app.css?v={{.Asset}}" />
<style>
  body { display: grid; place-items: center; min-height: 100vh; margin: 0; }
  .card { width: min(92vw, 380px); background: var(--bg-soft); border: 1px solid var(--line);
          border-radius: 14px; padding: 28px 26px; box-shadow: 0 18px 48px rgba(0,0,0,.45); }
  .card h1 { font-size: 18px; margin: 0 0 6px; }
  .card p  { color: var(--text-dim); font-size: 13px; margin: 0 0 18px; line-height: 1.6; }
  .card input { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 9px;
                border: 1px solid #475569; background: #0b0f19; color: var(--text); font-size: 14px; }
  .card input::placeholder { color: #64748b; }
  .card input:focus { outline: none; border-color: var(--accent);
                      box-shadow: 0 0 0 3px rgba(56, 189, 248, .18); }
  .card button { width: 100%; margin-top: 12px; padding: 10px 12px; border-radius: 9px; cursor: pointer;
                 border: 1px solid #3b5b8a; background: #1e3a5f; color: #e8f0fb; font-size: 14px;
                 font-weight: 500; }
  .card button:hover { background: #254a78; border-color: #4b6f9f; }
  .msg { margin-top: 12px; min-height: 18px; font-size: 12.5px; color: #fca5a5; }
  .foot { margin-top: 20px; font-size: 12px; color: var(--text-dim); display: flex; justify-content: space-between; }
  .foot a { color: var(--text-dim); }
</style>
</head>
<body>
<form class="card" method="post" action="{{.Base}}/-/login">
  <h1>{{.Product}}</h1>
  <p>该文档仅向受邀者开放。请粘贴作者给你的口令或一次性分享码。</p>
  <input type="hidden" name="next" value="{{.Next}}" />
  <input type="password" name="secret" placeholder="口令或分享码" autocomplete="current-password" autofocus />
  <button type="submit">进入</button>
  <div class="msg">{{.Error}}</div>
  <div class="foot"><span>v{{.Version}}</span><a href="{{.Base}}/-/about">关于</a></div>
</form>
</body>
</html>{{end}}
