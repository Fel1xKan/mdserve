{{define "layout"}}<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<meta name="mdserve-base" content="{{.Base}}" />
<title>{{.Title}}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%93%98%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="{{.Base}}/-/vendor/app.css?v={{.Asset}}" />
</head>
<body>
<div class="layout">
  <aside>
    <div class="brand">
      <div class="brand-logo">📘</div>
      <div class="brand-text">
        <h1>{{.SiteLabel}}</h1>
        <p>{{.BrandSub}}</p>
      </div>
      <button class="collapse-btn" id="collapseBtn" title="收起目录 (Ctrl+B)" aria-label="收起目录">«</button>
    </div>
    <form class="search-wrap" method="get" action="{{.Base}}/search">
      <input id="q" name="q" type="search" placeholder="全文检索（≥2 字，回车）" autocomplete="off" />
    </form>
    <div class="tree" id="tree">{{.TreeHTML}}</div>
    <div class="side-foot">
      <a href="{{.Base}}/-/about">关于</a>
      <span style="flex:1"></span>
      <form method="post" action="{{.Base}}/-/logout"><button type="submit">退出</button></form>
    </div>
  </aside>

  <main id="main">
    <div class="doc-head">
      <button class="mobile-toggle" id="navToggle" aria-label="目录">☰</button>
      <span class="path">{{.Path}}</span>
      <span class="spacer"></span>
      <button id="copyLink" type="button">复制链接</button>
    </div>
    {{if .TOCHTML}}<div id="toc">{{.TOCHTML}}</div>{{end}}
    <article id="doc">{{.Body}}</article>
  </main>
</div>
{{if .HasMermaid}}<script src="{{.Base}}/-/vendor/mermaid-lazy.js?v={{.Asset}}" data-mermaid="{{.Base}}/-/vendor/mermaid.js?v={{.Asset}}" defer></script>{{end}}
<script src="{{.Base}}/-/vendor/app.js?v={{.Asset}}" defer></script>
</body>
</html>{{end}}
