{{define "about"}}<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>关于 · {{.Product}}</title>
<link rel="stylesheet" href="{{.Base}}/vendor/app.css?v={{.Asset}}" />
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
  .wrap { width: min(92vw, 560px); }
  h1 { font-size: 24px; margin: 0 0 6px; }
  p.sub { color: var(--text-dim); margin: 0 0 22px; font-size: 13.5px; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  td { padding: 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.k { color: var(--text-dim); width: 132px; white-space: nowrap; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  .foot { margin-top: 24px; font-size: 12.5px; color: var(--text-dim); display: flex; gap: 16px; }
  .foot a { color: var(--text-dim); }
</style>
</head>
<body>
<div class="wrap">
  <h1>{{.Product}}</h1>
  <p class="sub">把 markdown 目录变成可分享的网页。</p>
  <table>
    <tr><td class="k">版本</td><td><code>{{.Version}}</code></td></tr>
    <tr><td class="k">提交</td><td><code>{{.Commit}}</code></td></tr>
    <tr><td class="k">构建时间</td><td><code>{{.Date}}</code></td></tr>
    <tr><td class="k">运行时长</td><td><code>{{.Uptime}}</code></td></tr>
  </table>
  <div class="foot"><a href="{{.Repo}}">{{.RepoLabel}}</a><a href="{{.Base}}/">返回</a></div>
</div>
</body>
</html>{{end}}
